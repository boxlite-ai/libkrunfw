# Companion to publish-release-standalone-bin.yml for the container kernel
# variant, which VMMs load from a file at runtime (krun_set_kernel). The lean
# profile omits bridge networking, netfilter/nf_tables, veth and overlayfs, so
# a guest booted on it cannot run containers of its own.
#
# The variant is carried as a config fragment, so the config the Makefile
# expects is assembled here rather than checked in, leaving the Makefile
# identical to upstream.
name: Publish the container kernel binary

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the kernel binaries to (empty uploads workflow artifacts only)"
        required: false
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  build:
    name: Build ${{ matrix.arch }} container kernel binary
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            # Makefile: KERNEL_BINARY_x86_64, bundled as an ELF image.
            kernel_image: vmlinux
            kernel_format: elf
          - arch: aarch64
            runner: ubuntu-24.04-arm
            # Makefile: KERNEL_BINARY_aarch64, uncompressed and loaded verbatim.
            kernel_image: arch/arm64/boot/Image
            kernel_format: raw
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y make gcc bc bison flex elfutils python3-pyelftools curl patch libelf-dev ccache
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
        shell: bash

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-container-${{ matrix.arch }}-${{ hashFiles('Makefile', 'config-libkrunfw*', 'patches/*.patch') }}
          restore-keys: |
            ccache-container-${{ matrix.arch }}-

      # Kconfig reads sequentially and `olddefconfig` normalises the result, so
      # appending is enough to override the lean profile's "is not set" lines.
      - name: Assemble container config
        run: |
          set -euo pipefail
          cat "config-libkrunfw_${{ matrix.arch }}" config-libkrunfw-container.fragment \
            > "config-libkrunfw-container_${{ matrix.arch }}"
        shell: bash

      - name: Build kernel image
        id: kernel
        env:
          CCACHE_MAXSIZE: 2G
        run: |
          set -euo pipefail
          sources="$(sed -n 's/^KERNEL_VERSION = //p' Makefile)"
          if [ -z "$sources" ]; then
            echo "could not read KERNEL_VERSION from Makefile" >&2
            exit 1
          fi
          export PATH="/usr/lib/ccache:$PATH"
          ccache --zero-stats
          make VARIANT=-container "$sources/${{ matrix.kernel_image }}"
          echo "sources=$sources" >> "$GITHUB_OUTPUT"
        shell: bash

      # The lean profile omits these, so a config regression would produce a
      # kernel that boots but cannot run nested containers.
      - name: Verify container networking is built in
        run: |
          set -euo pipefail
          for opt in CONFIG_BRIDGE CONFIG_VETH CONFIG_NETFILTER CONFIG_NF_TABLES \
                     CONFIG_NF_NAT CONFIG_OVERLAY_FS; do
            grep -qx "$opt=y" "${{ steps.kernel.outputs.sources }}/.config" || {
              echo "$opt is not built into the container kernel" >&2
              exit 1
            }
          done
        shell: bash

      - name: Summarize kernel binary
        run: |
          set -euo pipefail
          bin="libkrunfw-kernel-container-${{ matrix.arch }}.bin"
          cp -f "${{ steps.kernel.outputs.sources }}/${{ matrix.kernel_image }}" "$bin"
          sha256sum "$bin" > "$bin.sha256"
          {
            echo "### \`$bin\`"
            echo
            echo "- kernel: \`${{ steps.kernel.outputs.sources }}\`"
            echo "- format: \`${{ matrix.kernel_format }}\`"
            echo "- size: $(du -h "$bin" | cut -f1)"
            echo "- sha256: \`$(cut -d' ' -f1 "$bin.sha256")\`"
            echo
            echo '```'
            echo "BOXLITE_EXPERIMENTAL=custom-kernel boxlite run \\"
            echo "  --kernel \"\$PWD/$bin\" \\"
            echo "  --kernel-format ${{ matrix.kernel_format }} \\"
            echo "  --cap-add ALL  IMAGE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Upload kernel binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: libkrunfw-kernel-container-${{ matrix.arch }}
          path: |
            libkrunfw-kernel-container-${{ matrix.arch }}.bin
            libkrunfw-kernel-container-${{ matrix.arch }}.bin.sha256
          if-no-files-found: error

      - name: Attach kernel binary to release
        if: env.RELEASE_TAG != ''
        run: |
          gh release upload "$RELEASE_TAG" \
            "libkrunfw-kernel-container-${{ matrix.arch }}.bin" \
            "libkrunfw-kernel-container-${{ matrix.arch }}.bin.sha256" \
            --clobber
        env:
          GITHUB_TOKEN: ${{ github.TOKEN }}
        shell: bash
